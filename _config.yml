
title: "내 깃허브 블로그"
description: "기록과 정보를 정리하는 블로그입니다."
url: "https://ajflrms1234.github.io"
locale: "ko-KR"

remote_theme: "mmistakes/minimal-mistakes"
minimal_mistakes_skin: "default" # "dark", "air", "mint", "contrast" 등으로 변경 가능
minimal_mistakes_skin: "dark"

author:
  name: "BONGSUN"
  avatar: "/profile.jpg" # 방금 올린 사진 파일명과 정확히 일치해야 함
  bio: "기록과 정보를 정리하는 공간입니다."
  location: "South Korea"

defaults:
  - scope:
      path: ""
      type: posts
    values:
      layout: single
      author_profile: true
      read_time: true
      share: true
      related: true

plugins:
  - jekyll-remote-theme
  - jekyll-include-cache
  - jekyll-sitemap
  - jekyll-feed
  - jekyll-seo-tag

search: true
